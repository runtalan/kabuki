# Firebase App Hosting configuration for Kabuki.
# Docs: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  minInstances: 0
  maxInstances: 1
  concurrency: 80
  cpu: 1
  memoryMiB: 512

# Secrets are managed in Google Cloud Secret Manager. Create each secret with
# `firebase apphosting:secrets:set <NAME>` before the first deploy, then grant
# the backend access with `firebase apphosting:secrets:grantaccess <NAME>`.
env:
  - variable: DATABASE_URL
    secret: DATABASE_URL
    availability:
      - RUNTIME

  - variable: AUTH_SECRET
    secret: AUTH_SECRET
    availability:
      - RUNTIME

  - variable: AUTH_URL
    secret: AUTH_URL
    availability:
      - RUNTIME

  - variable: AUTH_TRUST_HOST
    value: "true"
    availability:
      - RUNTIME

  # Google OAuth (OIDC)
  - variable: AUTH_GOOGLE_ID
    secret: AUTH_GOOGLE_ID
    availability:
      - RUNTIME

  - variable: AUTH_GOOGLE_SECRET
    secret: AUTH_GOOGLE_SECRET
    availability:
      - RUNTIME

  # Plaid secrets
  - variable: PLAID_CLIENT_ID
    secret: PLAID_CLIENT_ID
    availability:
      - RUNTIME

  - variable: PLAID_SECRET
    secret: PLAID_SECRET
    availability:
      - RUNTIME

  - variable: PLAID_ENV
    secret: PLAID_ENV
    availability:
      - RUNTIME

  - variable: PLAID_PRODUCTS
    value: "transactions"
    availability:
      - RUNTIME

  - variable: PLAID_COUNTRY_CODES
    value: "US"
    availability:
      - RUNTIME

  # Supabase Storage (institution logo caching)
  - variable: SUPABASE_URL
    value: "https://qqhvjcwqhfvpjlisezaq.supabase.co"
    availability:
      - RUNTIME

  - variable: SUPABASE_SERVICE_ROLE_KEY
    secret: SUPABASE_SERVICE_ROLE_KEY
    availability:
      - RUNTIME

  # Alpaca (invest page)
  - variable: APCA_API_KEY_ID
    secret: APCA_API_KEY_ID
    availability:
      - RUNTIME

  - variable: APCA_API_SECRET_KEY
    secret: APCA_API_SECRET_KEY
    availability:
      - RUNTIME

  # Mom & Pop household — independent Plaid credentials
  - variable: PLAID_CLIENT_ID_MOMPOP
    secret: PLAID_CLIENT_ID_MOMPOP
    availability:
      - RUNTIME

  - variable: PLAID_SECRET_MOMPOP
    secret: PLAID_SECRET_MOMPOP
    availability:
      - RUNTIME

  - variable: PLAID_ENV_MOMPOP
    secret: PLAID_ENV_MOMPOP
    availability:
      - RUNTIME

  - variable: PLAID_PRODUCTS_MOMPOP
    value: "transactions"
    availability:
      - RUNTIME

  - variable: PLAID_COUNTRY_CODES_MOMPOP
    value: "US"
    availability:
      - RUNTIME
